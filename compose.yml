services:
  agent:
    image: ghcr.io/developerdurp/durpdeploy-agent:latest
    build: .
    restart: unless-stopped
    env_file:
      - ./compose.agent.env
    environment:
      DURPDEPLOY_AGENT_STATE_DIR: /var/lib/durpdeploy-agent
    volumes:
      - durpdeploy-agent-state:/var/lib/durpdeploy-agent
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, SETPCAP]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

volumes:
  durpdeploy-agent-state:
