# Copy this file to compose.yml and create compose.agent.env before starting.
services:
  agent:
    image: ghcr.io/developerdurp/durpdeploy-agent:latest
    restart: unless-stopped
    env_file:
      - ./compose.agent.env
    environment:
      DURPDEPLOY_AGENT_STATE_DIR: /var/lib/durpdeploy-agent
    volumes:
      - durpdeploy-agent-state:/var/lib/durpdeploy-agent
      - /sys/fs/cgroup/durpdeploy:/sys/fs/cgroup/durpdeploy:rw
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, SETPCAP, SYS_ADMIN, SYS_CHROOT]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

volumes:
  durpdeploy-agent-state:
