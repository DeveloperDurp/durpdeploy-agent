name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/durpdeploy-agent-linux-amd64 ./cmd/agent
          GOOS=linux GOARCH=arm64 go build -trimpath -o dist/durpdeploy-agent-linux-arm64 ./cmd/agent
      - uses: softprops/action-gh-release@a748f2fbd93a30a661a2b8bb0e9ac94f7b7d0a03 # v2
        with:
          files: dist/*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/developerdurp/durpdeploy-agent:${{ github.ref_name }}
            ghcr.io/developerdurp/durpdeploy-agent:latest
